<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="solvaneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="32" cy="32" r="30" fill="url(#solvaneGrad)" />
  <circle cx="32" cy="32" r="28" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3" />
  <!-- Friendly Mascot Face / Solvane "S" -->
  <text x="32" y="43" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" filter="url(#drop)">S</text>
  <!-- Subtle little friendly sparkle / wave dot -->
  <circle cx="46" cy="18" r="4" fill="#fbbf24" />
</svg>
